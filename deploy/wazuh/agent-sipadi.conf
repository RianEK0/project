<!-- Tambahkan blok ini di dalam <ossec_config> pada agent Wazuh di host SIPADI. -->
<localfile>
  <location>journald</location>
  <log_format>journald</log_format>
  <query field="_SYSTEMD_UNIT">sipadi-api.service</query>
</localfile>

<localfile>
  <location>/var/log/modsecurity/audit.log</location>
  <log_format>syslog</log_format>
</localfile>
