name: enterprise-hris

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  restart: unless-stopped
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8000
    FRONTEND_URL: http://localhost:5173
    SECURITY_TRUSTED_PROXIES: "*"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: enterprise_hris
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
    MAIL_FROM_ADDRESS: no-reply@enterprise-hris.local
    MAIL_FROM_NAME: Enterprise HRIS API
    COMPOSER_HOME: /tmp/composer-cache
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - composer_cache:/tmp/composer-cache
  networks:
    - hris
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  laravel:
    <<: *laravel-service
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-laravel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      laravel:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hris
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  queue:
    <<: *laravel-service
    init: true
    depends_on:
      laravel:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]

  scheduler:
    <<: *laravel-service
    init: true
    depends_on:
      laravel:
        condition: service_healthy
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_hris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_hris"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hris
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hris

  frontend:
    profiles: ["frontend"]
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      nginx:
        condition: service_healthy
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_APP_NAME: Enterprise HRIS
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - hris

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  composer_cache:
  frontend_node_modules:

networks:
  hris:
    driver: bridge
