<svg width="1200" height="1250" viewBox="0 0 1200 1250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="1250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFFCF7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="320" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#0F766E"/>
    </marker>
    <style>
      .title { font: 700 34px 'Arial', sans-serif; fill: #0F172A; }
      .subtitle { font: 500 18px 'Arial', sans-serif; fill: #475569; }
      .label { font: 700 18px 'Arial', sans-serif; fill: #0F172A; }
      .text { font: 500 16px 'Arial', sans-serif; fill: #334155; }
      .yes { font: 700 14px 'Arial', sans-serif; fill: #15803D; }
      .no { font: 700 14px 'Arial', sans-serif; fill: #B91C1C; }
      .small { font: 700 15px 'Arial', sans-serif; fill: #0F766E; }
    </style>
  </defs>

  <rect width="1200" height="1250" fill="url(#bg2)"/>
  <text x="600" y="70" text-anchor="middle" class="title">Flowchart Modul Absensi Wajah</text>
  <text x="600" y="105" text-anchor="middle" class="subtitle">Alur enrollment wajah, validasi biometrik, dan penyimpanan absensi</text>

  <rect x="420" y="150" rx="26" ry="26" width="360" height="88" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" filter="url(#shadow2)"/>
  <text x="600" y="192" text-anchor="middle" class="label">Buka Halaman Absensi</text>
  <text x="600" y="218" text-anchor="middle" class="text">Pegawai memilih fitur absensi wajah</text>

  <rect x="420" y="300" rx="24" ry="24" width="360" height="102" fill="url(#panel)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="600" y="342" text-anchor="middle" class="label">Pilih Mode</text>
  <text x="600" y="370" text-anchor="middle" class="text">Enroll wajah / Absen masuk / Absen pulang</text>

  <rect x="420" y="470" rx="24" ry="24" width="360" height="102" fill="url(#panel)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="600" y="512" text-anchor="middle" class="label">Aktifkan Kamera</text>
  <text x="600" y="540" text-anchor="middle" class="text">Webcam menyala lalu wajah di-capture</text>

  <rect x="420" y="640" rx="24" ry="24" width="360" height="102" fill="url(#panel)" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="600" y="682" text-anchor="middle" class="label">Deteksi Wajah</text>
  <text x="600" y="710" text-anchor="middle" class="text">Sistem mengambil descriptor wajah</text>

  <polygon points="600,800 780,900 600,1000 420,900" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow2)"/>
  <text x="600" y="888" text-anchor="middle" class="label">Mode Enrollment?</text>
  <text x="600" y="916" text-anchor="middle" class="text">Apakah user memilih daftar wajah?</text>

  <rect x="80" y="1060" rx="22" ry="22" width="360" height="108" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow2)"/>
  <text x="260" y="1100" text-anchor="middle" class="label">Simpan Descriptor Wajah</text>
  <text x="260" y="1128" text-anchor="middle" class="text">Data biometrik disimpan ke profil user</text>

  <rect x="760" y="1060" rx="22" ry="22" width="360" height="108" fill="#FCE7F3" stroke="#DB2777" stroke-width="2" filter="url(#shadow2)"/>
  <text x="940" y="1098" text-anchor="middle" class="label">Bandingkan Descriptor</text>
  <text x="940" y="1126" text-anchor="middle" class="text">Cek kecocokan dengan data tersimpan</text>

  <polygon points="940,760 1090,850 940,940 790,850" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="940" y="838" text-anchor="middle" class="label">Cocok?</text>
  <text x="940" y="866" text-anchor="middle" class="text">Valid atau tidak valid</text>

  <rect x="700" y="1010" rx="22" ry="22" width="230" height="74" fill="#DCFCE7" stroke="#16A34A" stroke-width="2" filter="url(#shadow2)"/>
  <text x="815" y="1055" text-anchor="middle" class="label">Simpan Absensi Valid</text>

  <rect x="950" y="1010" rx="22" ry="22" width="230" height="74" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#shadow2)"/>
  <text x="1065" y="1055" text-anchor="middle" class="label">Simpan Tidak Valid</text>

  <rect x="700" y="1188" rx="22" ry="22" width="480" height="42" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="940" y="1215" text-anchor="middle" class="label">Simpan waktu, foto capture, lokasi, dan update riwayat absensi</text>

  <line x1="600" y1="238" x2="600" y2="300" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="600" y1="402" x2="600" y2="470" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="600" y1="572" x2="600" y2="640" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow2)"/>
  <line x1="600" y1="742" x2="600" y2="800" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow2)"/>

  <path d="M420 900H260V1060" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <text x="300" y="888" class="yes">Ya</text>

  <path d="M780 900H940V760" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <text x="808" y="888" class="no">Tidak</text>

  <line x1="940" y1="940" x2="940" y2="970" stroke="#0F766E" stroke-width="4"/>
  <path d="M940 970H815V1010" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M940 970H1065V1010" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <text x="842" y="996" class="yes">Cocok</text>
  <text x="1012" y="996" class="no">Tidak cocok</text>

  <path d="M815 1084V1140H940V1188" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M1065 1084V1140H940V1188" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <path d="M260 1168V1210H660" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow2)"/>
  <text x="390" y="1198" class="small">Enrollment berhasil</text>
</svg>
