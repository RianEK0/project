name: Authorized Passive DAST

on:
  schedule:
    - cron: "31 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    if: ${{ vars.DAST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ secrets.DAST_TARGET_URL }}
      I_HAVE_WRITTEN_AUTHORIZATION: ${{ secrets.DAST_AUTHORIZED }}
      REPORT_DIR: security-reports
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify explicit target and authorization
        run: test -n "$TARGET_URL" && test "$I_HAVE_WRITTEN_AUTHORIZATION" = "yes"
      - name: Run OWASP ZAP passive baseline
        run: sh deploy/pentest/run-zap-baseline.sh
      - name: Retain DAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30
